name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  BD_VERSION: 1.3.4

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shm0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The S2 seam tests spawn the real bd CLI, so CI needs it.
      - name: Cache bd
        id: bd-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/bd
          key: bd-${{ env.BD_VERSION }}-linux-amd64

      - name: Install bd
        if: steps.bd-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          base="https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}"
          archive="beads_${BD_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "/tmp/${archive}" "${base}/${archive}"
          curl -fsSL -o /tmp/checksums.txt "${base}/checksums.txt"
          (cd /tmp && grep " ${archive}\$" checksums.txt | sha256sum -c -)
          tar xzf "/tmp/${archive}" -C "$HOME/.local/bin" bd
          chmod +x "$HOME/.local/bin/bd"

      - name: Verify bd
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bd --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cargo test --all

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shm0-dev

      - name: Read MSRV
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --all-targets
