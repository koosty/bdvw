[package]
name = "bdui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Desktop viewer for bd (beads) issue trackers"
repository = "https://github.com/koosty/bdvw"
license = "MIT"
readme = "README.md"
keywords = ["beads", "issue-tracker", "gpui", "gui"]
categories = ["gui"]

[[bin]]
name = "bdvw"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
